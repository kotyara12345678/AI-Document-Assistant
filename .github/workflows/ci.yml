# Continuous Integration: lint, backend tests (with real PostgreSQL + Qdrant),
# frontend tests + production build, and a full HTTP E2E smoke against a real
# stack with the external LLM mocked.
#
# Runs on every pull request and on every push to main. Any failing critical
# job fails the workflow (and therefore the required status checks).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: ada-backend:ci
  FRONTEND_IMAGE: ada-frontend:ci
  HF_CACHE_DIR: ~/.cache/ada-hf

jobs:
  lint:
    name: Lint (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (app)
        working-directory: backend
        run: ruff check app
      - name: Syntax check
        working-directory: backend
        run: python -m compileall -q app

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.10.0
        ports:
          - 6333:6333
        options: >-
          --health-cmd "perl -MIO::Socket::INET -e '$$s=IO::Socket::INET->new(PeerAddr=>\"127.0.0.1:6333\") or exit 1; print $$s \"GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\"; $$r=<$$s>; exit($$r =~ /200/?0:1)'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/ada-hf
          key: ada-hf-${{ env.HF_CACHE_DIR }}-all-MiniLM-L6-v2
          restore-keys: |
            ada-hf-

      - name: Prepare writable caches
        run: |
          mkdir -p ~/.cache/ada-hf coverage
          sudo chmod -R 777 ~/.cache/ada-hf coverage

      - name: Build backend image
        uses: ./.github/actions/docker-build
        with:
          image: ${{ env.BACKEND_IMAGE }}
          context: backend
          file: backend/Dockerfile
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Wait for service ports
        run: |
          python3 - <<'PY'
          import socket, time
          for port in (5432, 6333):
              for _ in range(60):
                  try:
                      socket.create_connection(("127.0.0.1", port), timeout=2).close()
                      break
                  except OSError:
                      time.sleep(2)
              else:
                  raise SystemExit(f"port {port} not ready")
          PY

      - name: Run pytest + coverage (migrations run inside via conftest)
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/postgres \
            -e QDRANT_URL=http://localhost:6333 \
            -e JWT_SECRET=ci-secret \
            -e TEST_DATABASE_NAME=docassistant_test \
            -v "${{ env.HF_CACHE_DIR }}:/data/hf" \
            -v "$(pwd)/coverage:/coverage" \
            ${{ env.BACKEND_IMAGE }} \
            sh -c "pytest tests -q --cov=app --cov-report=term-missing --cov-report=xml:/coverage/coverage.xml"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck + production build
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        working-directory: frontend
        run: npm test

  e2e:
    name: Integration / E2E (mocked LLM)
    runs-on: ubuntu-latest
    needs: [lint, backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        uses: ./.github/actions/docker-build
        with:
          image: ${{ env.BACKEND_IMAGE }}
          context: backend
          file: backend/Dockerfile
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Build frontend image
        uses: ./.github/actions/docker-build
        with:
          image: ${{ env.FRONTEND_IMAGE }}
          context: frontend
          file: frontend/Dockerfile
          tags: ${{ env.FRONTEND_IMAGE }}

      - name: Start CI stack (PostgreSQL + Qdrant + mock GigaChat + backend + frontend)
        run: |
          IMAGE_BACKEND=${{ env.BACKEND_IMAGE }} \
          IMAGE_FRONTEND=${{ env.FRONTEND_IMAGE }} \
          docker compose -f scripts/ci/docker-compose.ci.yml up -d --wait db gigachat-mock qdrant
          IMAGE_BACKEND=${{ env.BACKEND_IMAGE }} \
          IMAGE_FRONTEND=${{ env.FRONTEND_IMAGE }} \
          docker compose -f scripts/ci/docker-compose.ci.yml run --rm backend alembic upgrade head
          IMAGE_BACKEND=${{ env.BACKEND_IMAGE }} \
          IMAGE_FRONTEND=${{ env.FRONTEND_IMAGE }} \
          docker compose -f scripts/ci/docker-compose.ci.yml up -d --wait
          docker compose -f scripts/ci/docker-compose.ci.yml ps

      - name: Run E2E smoke (real HTTP through nginx)
        run: |
          python3 scripts/ci/e2e_smoke.py \
            --base-api http://localhost:8080 \
            --base-backend http://localhost:8000

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f scripts/ci/docker-compose.ci.yml logs --no-color > e2e-logs.txt || true

      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs.txt

      - name: Tear down CI stack
        if: always()
        run: docker compose -f scripts/ci/docker-compose.ci.yml down -v
