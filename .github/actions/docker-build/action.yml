name: "Docker build (with optional GHCR push)"
description: "Build a Docker image with BuildKit caching; optionally push to GHCR."

inputs:
  image:
    description: "Image name (without tag), e.g. ghcr.io/owner/app-backend"
    required: true
  context:
    description: "Build context directory"
    required: true
  file:
    description: "Dockerfile path (relative to repository root)"
    required: false
    default: "Dockerfile"
  tags:
    description: "Newline- or comma-separated tags to apply"
    required: true
  push:
    description: "Push to the registry (requires packages: write permission)"
    required: false
    default: "false"
  token:
    description: "Token for GHCR login (pass github.token at the workflow level)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build (and push) image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        tags: ${{ inputs.tags }}
        push: ${{ inputs.push }}
        load: ${{ inputs.push != 'true' }}
        cache-from: type=gha,scope=${{ inputs.image }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image }}
