# Staging deployment stack (single Docker Compose host).
#
# Upgraded automatically by the deploy-staging workflow, which uploads this
# file, scripts/deploy/deploy.sh, deploy/scripts/run_backend_migrations.sh and a
# generated backend/.env (from GitHub Environment secrets) into the app dir and
# runs deploy.sh with COMPOSE_PROJECT=ada-staging.
#
# Manual use on the server (repository checked out at the app dir):
#   docker compose -p ada-staging -f deploy/docker-compose.staging.yml up -d db
#   docker compose -p ada-staging -f deploy/docker-compose.staging.yml up -d
#
# Configuration lives in:
#   backend/.env          -> app settings + secrets (JWT_SECRET, GigaChat, ...)
#   POSTGRES_PASSWORD     -> DB password (compose interpolation, optional)
#   QDRANT_API_KEY        -> optional Qdrant API key (backend/.env)

name: ada-staging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docassistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docassistant}
      POSTGRES_DB: docassistant
    ports:
      - "127.0.0.1:${DB_BIND_PORT:-55432}:5432"
    volumes:
      - staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docassistant -d docassistant"]
      interval: 5s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.10.0
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "6333:6333"
    volumes:
      - staging_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "perl -MIO::Socket::INET -e '$$s=IO::Socket::INET->new(PeerAddr=>\"127.0.0.1:6333\") or exit 1; print $$s \"GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\"; $$r=<$$s>; exit($$r =~ /200/?0:1)'"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/kotyara12345678/ai-document-assistant-backend:latest}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://docassistant:${POSTGRES_PASSWORD:-docassistant}@db:5432/docassistant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: document_chunks
      UPLOAD_DIR: /data/uploads
      HF_HOME: /data/hf
    ports:
      - "8000:8000"
    volumes:
      - staging_uploads:/data/uploads
      - staging_hf:/data/hf
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    image: ${IMAGE_FRONTEND:-ghcr.io/kotyara12345678/ai-document-assistant-frontend:latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

  worker:
    image: ${IMAGE_BACKEND:-ghcr.io/kotyara12345678/ai-document-assistant-backend:latest}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://docassistant:${POSTGRES_PASSWORD:-docassistant}@db:5432/docassistant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: document_chunks
      UPLOAD_DIR: /data/uploads
      HF_HOME: /data/hf
    volumes:
      - staging_uploads:/data/uploads
      - staging_hf:/data/hf
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    entrypoint: ["python", "-m", "app.worker"]

volumes:
  staging_postgres:
  staging_qdrant:
  staging_uploads:
  staging_hf: