services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docassistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docassistant}
      POSTGRES_DB: ${POSTGRES_DB:-docassistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "perl -MIO::Socket::INET -e '$$s=IO::Socket::INET->new(PeerAddr=>\"127.0.0.1:6333\") or exit 1; print $$s \"GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\"; $$r=<$$s>; exit($$r =~ /200/?0:1)'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "6333:6333"
      - "6334:6334"

  backend:
    image: ghcr.io/kotyara12345678/ai-document-assistant-backend
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-docassistant}:${POSTGRES_PASSWORD:-docassistant}@db:5432/${POSTGRES_DB:-docassistant}
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /data/hf
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
      - hf_cache:/data/hf
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ghcr.io/kotyara12345678/ai-document-assistant-frontend
    build: ./frontend
    command: npm run dev
    working_dir: /app
    environment:
      # Enable file watching over the bind-mounted source on Windows hosts.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
  hf_cache:
