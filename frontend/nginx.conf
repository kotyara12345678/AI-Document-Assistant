server {
    listen 80;
    server_name _;

    # Allow uploads up to the backend's own limit (MAX_UPLOAD_SIZE_MB=50).
    # Without this, nginx's 1 MB default rejects larger files first with a bare
    # HTML 413, so the user never sees the backend's JSON error message.
    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    # Shared security headers (see security-headers.conf).
    include /etc/nginx/security-headers.conf;

    # A server-level `types` block replaces the inherited MIME map (it does not
    # merge), so we must include the standard mime.types here as well — otherwise
    # every file (including index.html) falls back to default_type.
    # The extra `mjs` mapping fixes Vite module bundles (e.g. the pdf.js worker),
    # which Alpine nginx's default mime.types lacks.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Let's Encrypt HTTP-01 validation: the host certbot webroot
    # (deploy/certbot-webroot) is bind-mounted to /usr/share/nginx/html/certbot.
    # This block must precede `location /` so it is matched first.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/certbot;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never let the browser cache index.html: it must always re-fetch the
    # latest hashed bundles so a deploy can never pin users to stale JS.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Versioned (content-hashed) assets are immutable by definition.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # API proxy to the backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Secondary API namespace (kept in sync with the backend routes)
    location /api2/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Backend health endpoint (used by the deploy smoke checks; the backend
    # itself is bound to 127.0.0.1 and is never exposed publicly).
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
